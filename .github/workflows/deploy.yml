name: Deploy NEXA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --pretty false

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Size report
        run: |
          BYTES=$(du -sb dist | cut -f1)
          MB=$(awk "BEGIN { printf \"%.2f\", $BYTES/1048576 }")
          echo "Bundle size: ${MB} MB"
          echo "### Bundle size" >> "$GITHUB_STEP_SUMMARY"
          echo "${MB} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$BYTES" -gt 8388608 ]; then
            echo "Bundle exceeds 8 MB."
            exit 1
          fi

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
