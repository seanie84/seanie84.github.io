name: Staging build

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc -b --pretty false
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: staging-dist
          path: dist
          retention-days: 7
