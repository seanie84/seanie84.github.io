<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" fill="none">
  <!-- NEXA arc-reactor monogram: three concentric segmented rings around a gold core -->
  <!-- Outer ring: 12 segments (12 gaps), cyan -->
  <circle cx="32" cy="32" r="28" stroke="#22d3ee" stroke-width="2"
          stroke-dasharray="11.327 3.336" stroke-dashoffset="7.33" stroke-linecap="butt"/>
  <!-- Gold accent segment at 12 o'clock (outer ring) -->
  <path d="M 32 4 A 28 28 0 0 1 39.274 5.352" stroke="#f5c542" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Mid ring: 8 segments -->
  <circle cx="32" cy="32" r="21" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.75"
          stroke-dasharray="13.244 3.253" stroke-dashoffset="2" stroke-linecap="butt"/>
  <!-- Inner ring: 6 segments -->
  <circle cx="32" cy="32" r="14" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.9"
          stroke-dasharray="11.327 3.336" stroke-dashoffset="5" stroke-linecap="butt"/>
  <!-- Core glow + gold core dot -->
  <circle cx="32" cy="32" r="6" fill="#f5c542" fill-opacity="0.18"/>
  <circle cx="32" cy="32" r="3" fill="#f5c542"/>
</svg>
